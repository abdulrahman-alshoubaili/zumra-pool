<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Zumra Pool: concept prototype for Shariah-compliant micro-investing.">
<title>Zumra Pool</title>
<meta name="theme-color" content="#3a1560">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --purple: #3c1764;
  --purple-d: #2a0f45;
  --header: #2f1150;
  --gold: #e5b021;
  --teal: #4fbfa8;
  --teal-t: #8fd8c8;
  --ink: #2b2140;
  --grey: #737380;
  --line: #e6e4ea;
  --tabbg: #f5f4f7;
  --sk: #e9e8ec;
  --font: "Montserrat", "Gotham", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: #1a0b2a; display: flex; align-items: center; justify-content: center; }
button { font-family: inherit; border: 0; background: none; cursor: pointer; padding: 0; color: inherit; }
input { font-family: inherit; }
svg { display: block; }

/* device: phone frame on desktop, full screen on a phone */
.device { width: 390px; height: 844px; border-radius: 48px; padding: 11px; background: #0b0710; box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px #2c2236; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 38px; overflow: hidden; background: #fff; display: flex; flex-direction: column; }
@media (max-width: 500px) {
  body { display: block; background: var(--purple); }
  .device { width: 100%; height: 100dvh; padding: 0; border-radius: 0; box-shadow: none; }
  .screen { border-radius: 0; }
}

/* status bar */
.sbar { flex: none; height: 47px; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0 30px; color: #fff; font-size: 14px; font-weight: 600; background: var(--purple); position: relative; z-index: 5; }
.sbar.clear { background: transparent; position: absolute; left: 0; right: 0; top: 0; }
.sbar .r { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
.bat { width: 24px; height: 12px; border: 1.5px solid rgba(255,255,255,.8); border-radius: 3.5px; padding: 1.5px; position: relative; }
.bat::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: rgba(255,255,255,.8); border-radius: 0 1px 1px 0; }
.bat i { display: block; height: 100%; width: 70%; background: #fff; border-radius: 1.5px; }

.view { position: absolute; inset: 0; display: flex; flex-direction: column; }
.hidden { display: none !important; }

/* ---------- splash ---------- */
.splash { background: radial-gradient(120% 80% at 30% 20%, #4a1d78 0%, #3a1662 45%, #2a0f45 100%); align-items: center; justify-content: center; }
.splash .lb { width: 92px; height: 3px; background: var(--gold); border-radius: 2px; overflow: hidden; margin-top: 18px; }
.splash .lb i { display: block; height: 100%; width: 0; background: #fff; border-radius: 2px; animation: load 2s ease-out forwards; }
@keyframes load { to { width: 64%; } }
.homebar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.85); }

/* ---------- login ---------- */
.login { background: linear-gradient(170deg, #42196c 0%, #34145a 45%, #2a1046 100%); color: #fff; padding: 47px 24px 0; }
.login .top { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; height: 24px; }
.login .lang { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.login .logo { display: flex; justify-content: center; margin-top: -10px; }
.seg { display: flex; width: 215px; height: 40px; margin: 20px auto 0; border: 1px solid rgba(255,255,255,.55); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; font-size: 14px; font-weight: 500; color: #fff; }
.seg button.on { background: var(--gold); color: #2b1a00; }
.fld { display: flex; align-items: center; border-bottom: 1px solid rgba(255,255,255,.28); height: 52px; margin-top: 18px; }
.fld input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #fff; font-size: 15px; font-weight: 500; letter-spacing: .01em; }
.fld input::placeholder { color: rgba(255,255,255,.45); }
.fld svg { opacity: .8; }
.signin { width: 100%; height: 47px; margin-top: 40px; border-radius: 4px; background: var(--teal); color: #fff; font-size: 15px; font-weight: 500; position: relative; }
.signin .spin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.links { display: flex; justify-content: space-between; margin-top: 26px; font-size: 14px; font-weight: 500; color: var(--gold); }
.faceid { display: flex; justify-content: center; margin-top: 26px; }
.register { width: 100%; height: 47px; margin-top: 30px; border: 1px solid rgba(255,255,255,.85); border-radius: 4px; color: var(--teal-t); font-size: 15px; font-weight: 500; }
.resume { display: block; margin: 22px auto 0; color: var(--gold); font-size: 14.5px; font-weight: 500; }
.bump { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }

/* spinner (white disc with gold arc, as in the app) */
.spin { width: 38px; height: 38px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); display: grid; place-items: center; }
.spin i { width: 26px; height: 26px; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--gold); border-right-color: var(--gold); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }

/* Face ID sheet */
.fid { position: absolute; inset: 0; display: grid; place-items: center; z-index: 20; }
.fid .box { width: 112px; height: 124px; border-radius: 22px; background: rgba(40,40,46,.86); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #fff; font-size: 13px; font-weight: 600; animation: pop .2s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.fid .ring { width: 54px; height: 54px; border-radius: 50%; border: 2.5px solid #fff; display: grid; place-items: center; }

/* ---------- app shell (home / do more) ---------- */
.app { background: #fff; }
.app .body { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
.app .body::-webkit-scrollbar { display: none; }
.nav { flex: none; height: 76px; border-top: 1px solid var(--line); background: #fff; display: flex; align-items: flex-start; justify-content: space-around; padding: 10px 4px 0; position: relative; }
.nav button { width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--grey); }
.nav button svg { color: #6c6c78; }
.nav .menu { margin-top: -22px; }
.nav .menu .c { width: 46px; height: 46px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.nav .menu span { margin-top: -3px; }

/* home */
.hhead { background: linear-gradient(180deg, #35135a 0%, #3d1868 100%); padding: 0 16px 14px; color: #fff; }
.tabs3 { display: flex; align-items: center; height: 52px; gap: 18px; font-size: 15px; font-weight: 500; }
.tabs3 button { height: 100%; position: relative; color: #fff; padding: 0 2px; }
.tabs3 button.on { color: var(--gold); }
.tabs3 button.on::after { content: ""; position: absolute; left: -6px; right: -6px; bottom: 0; height: 2px; background: var(--gold); }
.tabs3 .gear { margin-left: auto; }
.acard { width: 276px; height: 152px; margin: 26px auto 0; background: var(--gold); border-radius: 8px; padding: 14px 16px; color: #2a1a00; position: relative; overflow: hidden; }
.acard::before { content: ""; position: absolute; inset: 0; background: radial-gradient(140% 70% at 10% 120%, rgba(255,255,255,.18), transparent 60%), linear-gradient(170deg, transparent 55%, rgba(0,0,0,.05) 56%, transparent 75%); }
.acard .r1 { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; position: relative; }
.acard .r1 span { font-weight: 500; font-size: 12px; }
.acard .t { font-size: 11.5px; font-weight: 500; margin-top: 5px; position: relative; }
.acard .bal { position: absolute; right: 22px; bottom: 12px; text-align: right; font-size: 12.5px; }
.acard .bal b { font-size: 19px; font-weight: 600; }
.acard .bal small { display: block; font-size: 12px; margin-top: 2px; margin-right: 22px; }
.acard .bal svg { position: absolute; right: -14px; top: 6px; }
.arow { display: flex; justify-content: center; position: relative; font-size: 13px; margin-top: 16px; }
.arow a { position: absolute; right: 50px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.banner { margin: 16px 14px 0; height: 78px; border-radius: 6px; overflow: hidden; position: relative; background: linear-gradient(100deg, #3a1a6e 0%, #4b2590 55%, #5b38a8 100%); color: #fff; }
.banner::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(115deg, transparent 0 22px, rgba(255,255,255,.035) 22px 26px); }
.banner .amt { position: absolute; left: 14px; top: 8px; background: #2a1258; padding: 0 6px; font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
.banner p { position: absolute; left: 18px; top: 43px; margin: 0; font-size: 11px; line-height: 1.3; font-weight: 500; width: 236px; }
.banner svg { position: absolute; right: 8px; top: 4px; }
.lt { text-align: center; font-size: 16.5px; font-weight: 600; color: #222; margin: 30px 0 18px; }
.skrow { display: flex; gap: 8px; padding: 0 14px; margin-bottom: 26px; }
.sk { height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--sk) 0%, #f5f4f7 50%, var(--sk) 100%); background-size: 200% 100%; animation: sh 1.2s linear infinite; }
@keyframes sh { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.empty { text-align: center; color: var(--grey); font-size: 13px; padding: 10px 20px 30px; }
.acard.sk-card .skl { height: 9px; border-radius: 5px; background: linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.85)); margin-top: 10px; }
.listsk { margin: 26px 14px 0; border: 1px solid var(--line); border-radius: 8px; height: 76px; display: flex; align-items: center; gap: 14px; padding: 0 16px; }

/* do more */
.dhead { background: var(--header); height: 56px; color: #fff; display: flex; align-items: center; justify-content: center; position: relative; font-size: 15.5px; font-weight: 500; flex: none; }
.dhead .gear { position: absolute; right: 16px; }
.dhead .back { position: absolute; left: 12px; }
.dtabs { background: var(--tabbg); height: 64px; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; flex: none; }
.dtabs button { height: 100%; font-size: 15.5px; font-weight: 500; color: #2a2740; position: relative; padding: 0 2px; }
.dtabs button.on::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: 6px; height: 2px; background: var(--gold); }
.dtabs .dot { position: absolute; top: 18px; right: -8px; width: 7px; height: 7px; border-radius: 50%; background: #e0242f; }

.car { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 22px 36px 0; scrollbar-width: none; cursor: grab; }
.car::-webkit-scrollbar { display: none; }
.car.drag { scroll-snap-type: none; cursor: grabbing; }
.pcard { flex: 0 0 318px; height: 354px; border-radius: 10px; position: relative; overflow: hidden; scroll-snap-align: center; color: #fff; padding: 22px 20px; user-select: none; }
.pcard .wave { position: absolute; left: 0; right: 0; top: 110px; height: 110px; opacity: .9; pointer-events: none; }
.pcard h3 { margin: 0 0 10px; font-size: 17px; font-weight: 600; position: relative; }
.pcard.nw h3 { margin-right: 52px; }
.pcard p { margin: 0; font-size: 14px; line-height: 1.52; font-weight: 500; position: relative; }
.pcard ul { list-style: none; margin: 14px 0 0; padding: 0; font-size: 14px; line-height: 1.5; position: relative; }
.pcard li { display: flex; gap: 8px; margin-bottom: 8px; }
.pcard li svg { flex: none; margin-top: 3px; }
.pcard .add { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); width: 150px; height: 47px; background: #fff; border-radius: 3px; color: #3a2a5c; font-size: 15px; font-weight: 500; }
.pcard .add:active { background: #f0edf5; }
.ribbon { position: absolute; top: 0; right: 0; width: 92px; height: 92px; overflow: hidden; pointer-events: none; }
.ribbon span { position: absolute; top: 18px; right: -30px; width: 130px; height: 28px; background: var(--gold); transform: rotate(45deg); color: #1a1200; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-style: italic; }
.dots { display: flex; justify-content: center; gap: 6px; margin: 18px 0 30px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: #e2e1e6; cursor: pointer; }
.dots i.on { background: var(--teal); }
.g-saveplus { background: linear-gradient(202deg, #3f9b9b 0%, #3e7f92 30%, #44517f 62%, #4a2c76 100%); }
.g-special { background: linear-gradient(202deg, #3f9b9b 0%, #3e7f92 30%, #44517f 62%, #4a2c76 100%); }
.g-premium { background: linear-gradient(200deg, #8b1a5c 0%, #74195f 40%, #561b6c 100%); }
.g-ida { background: linear-gradient(200deg, #8c1b5e 0%, #7a1a62 40%, #5c1c6e 100%); }
.g-zumra { background: linear-gradient(202deg, #4bb3a2 0%, #3d8494 30%, #4a4a86 62%, #552988 100%); }
.noff { text-align: center; color: var(--grey); font-size: 14px; padding: 80px 30px; }
.toast { position: absolute; left: 14px; right: 14px; top: 58px; background: #2b2140; color: #fff; border-radius: 8px; padding: 12px 14px; font-size: 13px; z-index: 30; animation: pop .2s ease-out; }


/* ================= Zumra Pool ================= */
#v-zumra .dhead .bell { position: absolute; right: 14px; }
#v-zumra .dhead .bell .bd { position: absolute; top: -4px; right: -5px; min-width: 16px; height: 16px; border-radius: 8px; background: #e0242f; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
#zBody { background: #f5f4f7; }
.z { padding: 14px 14px 26px; color: var(--ink); font-size: 13.5px; }
.z h2 { font-size: 17px; margin: 4px 2px 4px; font-weight: 700; color: #241a38; }
.z .lead { color: var(--grey); font-size: 12.5px; margin: 0 2px 12px; line-height: 1.5; }
.zc { background: #fff; border-radius: 10px; padding: 14px; box-shadow: 0 1px 3px rgba(40,20,70,.07); margin-bottom: 12px; }
.zc h4 { margin: 0 0 8px; font-size: 14px; font-weight: 700; color: #241a38; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.zc h4 a { font-size: 12px; font-weight: 600; color: var(--purple); cursor: pointer; }
.zc p { margin: 0; line-height: 1.55; color: #4a4458; font-size: 13px; }
.zsec { font-size: 11.5px; font-weight: 700; color: var(--grey); letter-spacing: .06em; text-transform: uppercase; margin: 18px 2px 8px; display: flex; justify-content: space-between; align-items: center; }
.zsec a { text-transform: none; letter-spacing: 0; color: var(--purple); cursor: pointer; font-size: 12px; }
.zhero { background: linear-gradient(202deg, #4bb3a2 0%, #3d8494 32%, #4a4a86 66%, #552988 100%); color: #fff; border-radius: 12px; padding: 16px; position: relative; overflow: hidden; margin-bottom: 12px; }
.zhero .k { font-size: 12px; opacity: .85; }
.zhero .v { font-size: 26px; font-weight: 700; margin: 4px 0 10px; letter-spacing: -.01em; }
.zhero .v small { font-size: 13px; font-weight: 600; opacity: .85; margin-right: 4px; }
.zhero .row { display: flex; gap: 10px; position: relative; }
.zhero .row div { flex: 1; background: rgba(255,255,255,.12); border-radius: 8px; padding: 8px 10px; font-size: 11px; }
.zhero .row b { display: block; font-size: 13.5px; margin-top: 2px; }
.zhero .wave, .zpool .wave { top: 60px; }
.pos { color: #1d9a72 !important; } .neg { color: #cc3d4a !important; }
.zhero .pos { color: #b8f2d9 !important; } .zhero .neg { color: #ffc2c8 !important; }
.zqa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.zqa button { background: #fff; border-radius: 10px; padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; color: #3a2a5c; box-shadow: 0 1px 3px rgba(40,20,70,.07); }
.zqa .qi { width: 38px; height: 38px; border-radius: 50%; background: #f1ecf7; color: var(--purple); display: grid; place-items: center; }
.zqa svg { width: 19px; height: 19px; }
.zrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid #efedf2; }
.zrow:last-child { border-bottom: 0; }
.zrow.tap { cursor: pointer; }
.zrow .ico { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; color: #fff; font-weight: 700; font-size: 13px; }
.zrow .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: #241a38; }
.zrow .nm small { display: block; font-weight: 500; color: var(--grey); font-size: 11.5px; margin-top: 2px; }
.zrow .am { text-align: right; font-size: 13px; font-weight: 700; white-space: nowrap; }
.zrow .am small { display: block; font-size: 11px; font-weight: 600; color: var(--grey); margin-top: 3px; }
.zkv { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #efedf2; font-size: 13px; }
.zkv:last-child { border-bottom: 0; }
.zkv span { color: var(--grey); }
.zkv b { font-weight: 600; text-align: right; color: #241a38; }
.zkv.total { border-top: 1.5px solid #241a38; border-bottom: 0; margin-top: 4px; padding-top: 12px; }
.zkv.total b, .zkv.total span { font-weight: 700; color: #241a38; font-size: 14px; }
.zbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 47px; border-radius: 4px; background: var(--teal); color: #fff; font-size: 15px; font-weight: 600; margin-top: 10px; }
.zbtn.purple { background: var(--purple); }
.zbtn.ghost { background: #fff; color: var(--purple); box-shadow: inset 0 0 0 1.5px var(--purple); }
.zbtn.danger { background: #fff; color: #cc3d4a; box-shadow: inset 0 0 0 1.5px #cc3d4a; }
.zbtn:disabled { opacity: .45; cursor: not-allowed; }
.zpill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 12px; font-size: 10.5px; font-weight: 700; white-space: nowrap; }
.zpill.ok { background: #e3f5ee; color: #1d9a72; } .zpill.wait { background: #fdf1dc; color: #b77a0c; } .zpill.bad { background: #fbe7e9; color: #cc3d4a; } .zpill.mut { background: #efedf2; color: var(--grey); }
.zrisk { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 6px; }
.zrisk i { width: 16px; height: 6px; border-radius: 3px; background: #e2dfe8; }
.zpool .zrisk i { background: rgba(255,255,255,.3); }
.zrisk i.on { background: currentColor !important; }
.zpool { border-radius: 12px; color: #fff; padding: 16px; position: relative; overflow: hidden; margin-bottom: 12px; }
.zpool h3 { margin: 0 0 4px; font-size: 17px; font-weight: 700; position: relative; }
.zpool .meta { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0 4px; font-size: 11.5px; }
.zpool .meta div { background: rgba(255,255,255,.12); border-radius: 8px; padding: 8px 10px; }
.zpool .meta b { display: block; font-size: 13px; margin-top: 2px; }
.zpool p { position: relative; margin: 0; font-size: 12.8px; line-height: 1.5; opacity: .95; }
.zpool .zbtn { background: #fff; color: #3a2a5c; position: relative; height: 42px; font-size: 14px; }
.zpool .rec { position: absolute; top: 12px; right: 12px; background: var(--gold); color: #1a1200; font-size: 10.5px; font-weight: 700; padding: 3px 8px; border-radius: 10px; }
.z-stable { background: linear-gradient(202deg, #3f9b9b 0%, #3e7f92 35%, #44517f 70%, #4a2c76 100%); }
.z-balanced { background: linear-gradient(200deg, #6a3fa0 0%, #552988 50%, #3c1764 100%); }
.z-growth { background: linear-gradient(200deg, #8c1b5e 0%, #7a1a62 40%, #5c1c6e 100%); }
.zdisc { background: #fdf3df; border: 1px solid #f3dca8; color: #6b4b06; border-radius: 10px; padding: 10px 12px; font-size: 11.5px; line-height: 1.5; margin-bottom: 12px; display: flex; gap: 8px; }
.zdisc b { color: #4a3304; }
.zfield { margin-top: 12px; }
.zfield label { display: block; font-size: 12px; font-weight: 600; color: var(--grey); margin-bottom: 6px; }
.zin { display: flex; align-items: center; border: 1.5px solid #e2dfe8; border-radius: 8px; background: #fff; height: 50px; padding: 0 12px; gap: 8px; }
.zin:focus-within { border-color: var(--purple); }
.zin span { font-weight: 700; color: var(--grey); font-size: 13px; }
.zin input { flex: 1; min-width: 0; border: 0; outline: none; font-size: 20px; font-weight: 700; color: #241a38; background: none; }
.zin.err { border-color: #cc3d4a; }
.zerr { color: #cc3d4a; font-size: 12px; font-weight: 600; margin-top: 6px; }
.zhint { color: var(--grey); font-size: 11.5px; margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.zchips { display: flex; flex-wrap: wrap; gap: 8px; }
.zchip { padding: 8px 13px; border-radius: 18px; background: #fff; border: 1.5px solid #e2dfe8; font-size: 12.5px; font-weight: 600; color: #3a2a5c; }
.zchip.on { border-color: var(--purple); background: #f1ecf7; color: var(--purple); }
.zseg { display: flex; background: #ece9f1; border-radius: 8px; padding: 3px; }

  }
  const empty = (title, text, btn) => `<div class="zc"><div class="zempty"><h3>${title}</h3><p>${text}</p>${btn ? `<button class="zbtn" data-z="go" data-a="discover">Explore Investment Pools</button>` : ''}</div></div>`;

    /* 9. Withdraw Investment */

      if (!S.holdings.length) return empty('Nothing to withdraw', 'Once you invest, you can request a withdrawal here.', false) + status;

        ${S.holdings.length > 1 ? `<div class="zchips" style="margin-bottom:12px">${S.holdings.map((x, j) => `<button class="zchip ${j === idx ? 'on' : ''}" data-z="withdrawFor" data-a="${j}" data-r="1">${POOLS[x.pool].name}</button>`).join('')}</div>` : ''}

        <button class="zbtn purple" data-z="wReview" data-a="${idx}">Review Withdrawal Request</button>${status}`;

    wreview() {
      const w = S.wdraft, h = S.holdings[w.i], amt = +w.amount;
      const profit = Math.max(0, (h.value - h.net) / h.value) * amt, perf = profit * PERF;
      return `<h2>Review Withdrawal Request</h2>
        <div class="zc"><div class="zkv"><span>Pool</span><b>${POOLS[h.pool].name}</b></div><div class="zkv"><span>Withdrawal amount</span><b>${bd(amt)}</b></div>
          <div class="zkv"><span>Realized profit in this amount</span><b>${bd(profit)}</b></div><div class="zkv"><span>Performance fee (2%)</span><b>${bd(-perf)}</b></div>
          <div class="zkv total"><span>You receive</span><b>${bd(amt - perf)}</b></div><div class="zkv" style="border:0"><span>Credit to</span><b>Current Account</b></div></div>
        <div class="zc"><h4>Estimated Processing Timeline</h4><div class="ztl">
          <div class="ev now"><span class="d"></span><b>Request submitted</b><small>${fd(S.today)}</small></div>
          <div class="ev"><span class="d"></span><b>Notice period ends</b><small>${fd(addD(S.today, NOTICE))}</small></div>
          <div class="ev"><span class="d"></span><b>Units redeemed</b><small>${fd(addD(S.today, NOTICE + 1))}</small></div>
          <div class="ev"><span class="d"></span><b>Funds credited</b><small>by ${fd(addD(S.today, NOTICE + 3))}</small></div></div></div>
        <button class="zbtn purple" data-z="wSubmit">Submit Request</button>`;
    },
    wstatus({ id }) {
      const w = S.wds.find(x => x.id === id), done = w.status === 'Completed';
      return `<div class="zc zbig"><div class="ci" style="background:${done ? 'var(--teal)' : '#e5b021'}">${done ? ic.check : ic.clock}</div>
          <h3>${done ? 'Withdrawal Completed' : 'Withdrawal Request Submitted'}</h3><p>Reference ZW-${5100 + w.id}</p></div>
        <div class="zc"><h4>Withdrawal Request Status ${pill(w.status)}</h4><div class="ztl">
          <div class="ev done"><span class="d"></span><b>Request submitted</b><small>${fd(w.date)}</small></div>
          <div class="ev ${done ? 'done' : 'now'}"><span class="d"></span><b>Redemption notice period (${NOTICE} days)</b><small>Ends ${fd(addD(w.date, NOTICE))}</small></div>
          <div class="ev ${done ? 'done' : ''}"><span class="d"></span><b>Units redeemed</b><small>${fd(addD(w.date, NOTICE + 1))}</small></div>
          <div class="ev ${done ? 'done' : ''}"><span class="d"></span><b>${bd(w.net)} credited to Current Account</b><small>${done ? fd(addD(w.date, NOTICE + 3)) : `by ${fd(addD(w.date, NOTICE + 3))}`}</small></div></div></div>
        ${done ? '' : `<button class="zdemo" data-z="wFinish" data-a="${w.id}">⏩ Prototype: skip the ${NOTICE}-day notice period</button>`}
        <button class="zbtn ghost" data-z="home">Back to Home</button>`;
    },

    /* 10. Sharia Compliance and Disclosures */
    sharia() {
      const sec = [
        ['Sharia-Compliant Investing', 'Every pool invests only in assets and contracts that are Shariah-compliant. Holdings are screened against AAOIFI standards.'],
        ['Sharia Supervisory Oversight', 'In production, the bank’s Sharia Supervisory Board would review the pool structure, its investments and an annual Sharia audit. This prototype has not been reviewed yet.'],
        ['Permitted Investment Activities', 'Sukuk, Murabaha placements, Ijara real estate and screened equities. Excluded: conventional finance, alcohol, tobacco, gambling, weapons and other non-permissible activities.'],
        ['Investment Structure', 'Mudaraba: investors provide the capital (Rab al-Mal) and the bank manages it as Mudarib for a pre-agreed share of the profit.'],
        ['Profit and Loss Sharing', 'Profit is shared by the agreed ratio. Losses are borne by investors in proportion to their capital, unless caused by the manager\'s negligence or misconduct.'],
        ['Fees and Charges', 'Operational fee: 1% of each contribution. Performance fee: 2% of eligible realized profits. No withdrawal fee.'],
        ['Investment Risks', 'Market, profit-rate, credit, liquidity and currency risk. Each pool lists its main risks.'],
        ['No Guaranteed Returns', 'Expected profit rates are indicative. Your investment can lose value, and you may get back less than you put in.'],
        ['Legal and Regulatory Disclosures', 'Zumra Pool is a proposed concept. Before launch it would need Central Bank of Bahrain approval, Sharia review and legal review. All fees and periods shown are assumptions.'],
      ];
      return `<h2>Sharia Compliance and Disclosures</h2><p class="lead">How Zumra Pool works, in plain language.</p>
        <div class="zc zfaq">${sec.map(([t, b], i) => `<details ${i < 2 ? 'open' : ''}><summary>${t}</summary><p>${b}</p></details>`).join('')}</div>
        <button class="zbtn ghost" data-z="toast" data-a="The full disclosure document would open here">Read Full Disclosures</button>`;
    },

    /* 11. Notifications */
    notifs() {
      return S.notifs.length ? `<div class="zc" style="padding:4px 14px">${S.notifs.map(n => `<div class="zrow" style="align-items:flex-start"><div class="ico" style="background:${n.read ? '#c9c2d4' : 'var(--purple)'}">${ic.bell.replace('width="21" height="21"', 'width="17" height="17"')}</div><div class="nm">${n.t}<small style="line-height:1.45">${n.b}</small></div><small style="color:var(--grey);font-size:10.5px;white-space:nowrap;margin-top:2px">${fd(n.d).slice(0, -5)}</small></div>`).join('')}</div>` : empty('No notifications', '', false);
    },

    /* 12. Transaction History */
    history() {
      const F = { All: () => true, Contributions: t => t.type === 'Contribution', 'Operational Fees': t => /Fee/.test(t.type), 'Investment Returns': t => t.type === 'Investment Return', Withdrawals: t => t.type === 'Withdrawal' };
      const list = S.tx.filter(F[S.txFilter]);
      return `<h2>Transaction History</h2>
        <div class="zftabs">${Object.keys(F).map(k => `<button class="zchip ${S.txFilter === k ? 'on' : ''}" data-z="txf" data-a="${k}">${k === 'All' ? 'All Transactions' : k}</button>`).join('')}</div>
        <div class="zc" style="padding:4px 14px">${list.length ? list.map(txRow).join('') : '<p style="padding:14px 0;text-align:center;color:var(--grey)">No transactions here yet.</p>'}</div>
        <button class="zbtn ghost" data-z="toast" data-a="Statement prepared (prototype — no file is generated)">Download Statement</button>`;
    },

    /* 13. Risk Profile Assessment */
    risk() {
      const Q = [
        ['q1', 'How long do you plan to keep this money invested?', [['Less than 2 years', 1], ['2–5 years', 2], ['More than 5 years', 3]]],
        ['q2', 'If your investment fell 10% in a month, you would…', [['Withdraw my money', 1], ['Wait for it to recover', 2], ['Invest more', 3]]],
        ['q3', 'What matters most to you?', [['Protecting my money', 1], ['A balance of safety and growth', 2], ['The highest long-term growth', 3]]],
        ['q4', 'How much investing experience do you have?', [['None', 1], ['Some', 2], ['A lot', 3]]],
      ];
      const a = S.riskAns, done = Q.every(([k]) => a[k]);
      if (S.risk) {
        const p = POOLS[S.risk.pool];
        return `<div class="zc zbig"><div class="ci" style="background:${p.color}">${sized(ic.gauge, 30).replace('currentColor', '#fff')}</div><h3>Your profile: ${['', 'Cautious', 'Moderate', 'Adventurous'][p.level]}</h3><p>Based on your answers, the <b>${p.name}</b> fits you best.</p></div>
          <button class="zbtn purple" data-z="pool" data-a="${S.risk.pool}">View ${p.name}</button><button class="zbtn ghost" data-z="riskRedo">Retake Assessment</button>`;
      }
      return `<h2>Risk Profile Assessment</h2><p class="lead">4 quick questions help us suggest a suitable pool.</p>
        ${Q.map(([k, q, opts], n) => `<div class="zc zq"><b>${n + 1}. ${q}</b>${opts.map(([l, v]) => `<button class="zopt ${a[k] === v ? 'on' : ''}" data-z="ans" data-a="${k}|${v}"><span class="rd"></span>${l}</button>`).join('')}</div>`).join('')}
        <button class="zbtn purple" data-z="riskDone" ${done ? '' : 'disabled'}>See My Result</button>`;
    },

    /* 14. Investment Calculator */
    calc() {
      const c = S.calc, p = POOLS[c.pool], r = p.rate / 100 / 12;
      let v = 0; const yearly = [];
      for (let m = 1; m <= c.years * 12; m++) { v = v * (1 + r) + c.monthly * (1 - FEE); if (m % 12 === 0) yearly.push(v); }
      const paid = c.monthly * c.years * 12, gain = v - paid, max = v * 1.05, slot = 270 / yearly.length, bw = Math.min(26, slot - 6);
      return `<h2>Investment Calculator</h2><p class="lead">See what regular monthly contributions could grow to. This is an illustration, not a promise.</p>
        <div class="zc"><div class="zchips" style="margin-bottom:6px">${Object.entries(POOLS).map(([k, x]) => `<button class="zchip ${c.pool === k ? 'on' : ''}" data-z="calcPool" data-a="${k}">${x.name}</button>`).join('')}</div>
          <div class="zfield"><label>Monthly contribution: <b style="color:var(--purple)" id="zcM">BHD ${c.monthly}</b></label><input class="zrange" type="range" min="10" max="500" step="10" value="${c.monthly}" data-zr="monthly"></div>
          <div class="zfield"><label>Period: <b style="color:var(--purple)" id="zcY">${c.years} year${c.years > 1 ? 's' : ''}</b></label><input class="zrange" type="range" min="1" max="10" step="1" value="${c.years}" data-zr="years"></div></div>
        <div class="zhero">${ic.wave}<div class="k" style="position:relative">Estimated value after ${c.years} year${c.years > 1 ? 's' : ''}</div><div class="v" style="position:relative"><small>BHD</small>${num(v)}</div>
          <div class="row"><div>You contribute<b>${bd(paid)}</b></div><div>Potential returns<b class="${gain >= 0 ? 'pos' : 'neg'}">${bd(gain, true)}</b></div></div></div>
        <div class="zc"><svg viewBox="0 0 300 110" width="100%">${yearly.map((y, i) => { const x = 20 + i * slot + (slot - bw) / 2, hp = c.monthly * 12 * (i + 1) / max * 86, hv = y / max * 86; return `<rect x="${x}" y="${92 - hv}" width="${bw}" height="${hv}" rx="3" fill="#4fbfa8"/><rect x="${x}" y="${92 - Math.min(hp, hv)}" width="${bw}" height="${Math.min(hp, hv)}" rx="3" fill="#552988"/><text x="${x + bw / 2}" y="105" font-size="9" text-anchor="middle" fill="#8a8399">Y${i + 1}</text>`; }).join('')}</svg>
          <div class="zlegend" style="grid-template-columns:1fr 1fr;margin-top:6px"><div><i style="background:#552988"></i>Contributions</div><div><i style="background:#4fbfa8"></i>Potential returns</div></div>
          <p style="font-size:11px;color:var(--grey);margin-top:8px">Assumes ${p.rate}% a year (hypothetical) after the 1% operational fee. Actual returns are not guaranteed and may be lower or negative.</p></div>
        <button class="zbtn purple" data-z="startInvest" data-a="${c.pool}">Start Investing</button>`;
    },

    /* 15. Help and Support */
    help() {
      const faq = [
        ['What is Zumra Pool?', 'A proposed banking service that lets you invest small amounts, once or every month, in Shariah-compliant investment pools.'],
        ['What is the minimum amount?', 'BHD 50 for the Stable Pool and BHD 100 for the Balanced and Growth pools.'],
        ['Are my returns guaranteed?', 'No. Returns depend on how the investments perform. Your investment can go down as well as up.'],
        ['How do I withdraw?', `Go to Withdraw, enter an amount and submit. After a ${NOTICE}-day notice period, the money is credited to your account.`],
        ['What fees do I pay?', '1% of each contribution, plus 2% of the profit you actually realize when you withdraw. There is no withdrawal fee.'],
        ['Can I stop my monthly contribution?', 'Yes. You can pause, resume or cancel it any time from Monthly Contributions.'],
      ];
      return `<h2>Help and Support</h2><div class="zsec" style="margin-top:6px">Frequently Asked Questions</div>
        <div class="zc zfaq">${faq.map(([q, ans]) => `<details><summary>${q}</summary><p>${ans}</p></details>`).join('')}</div>
        <div class="zsec">Contact Us</div>
        <div class="zc" style="padding:4px 14px">${[['Chat with us', 'Usually replies in a few minutes'], ['Call us', 'Available 24/7'], ['Visit a branch', 'Find your nearest branch']].map(([t, s]) => `<div class="zrow tap" data-z="toast" data-a="Not available in the prototype"><div class="ico" style="background:#f1ecf7;color:var(--purple)">${sized(ic.help, 19)}</div><div class="nm">${t}<small>${s}</small></div>${ic.chev}</div>`).join('')}</div>`;
    },

    /* 16. Profile and Settings */
    profile() {
      const st = S.settings, tg = (k, t, s) => `<div class="ztoggle"><div>${t}<small>${s}</small></div><span class="sw ${st[k] ? 'on' : ''}" data-z="set" data-a="${k}"></span></div>`;
      return `<h2>Profile and Settings</h2>
        <div class="zc"><h4>Customer Details</h4><div class="zkv"><span>Name</span><b>Ahmed Ali</b></div><div class="zkv"><span>CPR</span><b>•••••••45</b></div><div class="zkv"><span>Mobile</span><b>+973 •••• ••21</b></div><div class="zkv"><span>Linked account</span><b>Current Account</b></div></div>
        <div class="zc"><h4>Risk Profile <a data-z="go" data-a="risk">${S.risk ? 'View' : 'Start'}</a></h4><p>${S.risk ? `${['', 'Cautious', 'Moderate', 'Adventurous'][POOLS[S.risk.pool].level]} · suggested ${POOLS[S.risk.pool].name}` : 'Not assessed yet.'}</p></div>
        <div class="zc"><h4>Account Settings</h4>${tg('notif', 'Push notifications', 'Contribution reminders and updates')}${tg('estatement', 'E-statements', 'Monthly statement by email')}</div>
        <div class="zc"><h4>Consents</h4>${tg('marketing', 'Marketing offers', 'News about new pools and offers')}<div class="zkv" style="border:0"><span>Investment terms accepted</span><b>${S.termsDate ? fd(S.termsDate) : 'Not yet'}</b></div></div>`;
    },
  };

  /* ---------------- actions ---------------- */
  function startInvest(k) {
    const p = POOLS[k], has = S.holdings.find(h => h.pool === k);
    S.draft = { pool: k, amount: has ? p.suggested : p.suggested * 2, mode: has && has.monthly && has.monthly.status === 'Active' ? 'once' : 'monthly', monthly: p.suggested, day: 1, auto: true, terms: false, riskAck: false };
    go('invest');
  }
  const keepAmt = () => { const el = document.getElementById('zAmt'); if (el && +el.value) S.draft.amount = +el.value; };
  function invest() {
    const d = S.draft, fee = d.amount * FEE, total = d.amount + fee;
    go('processing', {}, true);
    setTimeout(() => {
      if (total > S.balance) { go('error', { reason: `Your Current Account doesn't have enough balance for ${bd(total)}. No money was taken.` }, true); return; }
      S.balance -= total;
      S.termsDate = new Date(S.today);
      let h = S.holdings.find(x => x.pool === d.pool);
      if (!h) { h = { pool: d.pool, net: 0, gross: 0, value: 0, monthly: null }; S.holdings.push(h); if (!S.hist.length) S.hist.push({ d: new Date(S.today), v: 0 }); }
      h.net += d.amount; h.gross += total; h.value += d.amount;
      if (d.mode === 'monthly') h.monthly = { amount: d.monthly, day: d.day, status: 'Active', auto: d.auto };
      const t = addTx('Contribution', d.pool, d.amount, 'Processing');
      addTx('Operational Fee', d.pool, -fee);
      recordHist();
      S.stack = [{ s: 'home', p: {} }];
      go('success', { txId: t.id, monthly: d.mode === 'monthly' ? h.monthly : null });
      setTimeout(() => { t.status = 'Completed'; notify('Contribution Successful', `${bd(d.amount)} was added to your ${POOLS[d.pool].name}.`); render(); }, 2500);
    }, 1600);
  }
  function simulate() {
    for (let m = 0; m < 6; m++) {
      const dt = new Date(S.today); dt.setMonth(dt.getMonth() + 1); S.today = dt;
      S.holdings.forEach((h, j) => {
        const p = POOLS[h.pool];
        const g = h.value * (p.rate / 100 / 12 + Math.sin((m + 1) * 1.9 + j) * p.level * 0.004);
        h.value += g;
        addTx('Investment Return', h.pool, g);
        if (h.monthly && h.monthly.status === 'Active') {
          const amt = h.monthly.amount, fee = amt * FEE;
          if (S.balance >= amt + fee) {
            S.balance -= amt + fee; h.net += amt; h.gross += amt + fee; h.value += amt;
            addTx('Contribution', h.pool, amt); addTx('Operational Fee', h.pool, -fee);
          } else addTx('Contribution', h.pool, amt, 'Failed');
        }
      });
      recordHist();
    }
    const t = totals();
    if (t.monthly) notify('Monthly Contribution Reminder', `Your next contribution of ${bd(t.monthly)} is due on ${fd(nextOn(S.today, t.nextDay))}. Please keep enough balance in your Current Account.`);
    notify('Investment Statement Available', `Your Zumra Pool statement for ${MON[S.today.getMonth()]} ${S.today.getFullYear()} is ready to download.`);
    notify('Portfolio Performance Update', `Your portfolio is now worth ${bd(t.v)} (${pct(t.pct)} since you started).`);
    toast('6 months simulated');
    render();
  }
  function submitWithdrawal() {
    const w = S.wdraft, h = S.holdings[w.i], amt = +w.amount, share = amt / h.value;
    const perf = Math.max(0, h.value - h.net) * share * PERF;
    h.net -= h.net * share; h.gross -= h.gross * share; h.value -= amt;
    const req = { id: S.wds.length + 1, pool: h.pool, amount: amt, net: amt - perf, perf, date: new Date(S.today), status: 'Notice period' };
    req.tx = addTx('Withdrawal', h.pool, -amt, 'Pending');
    S.wds.push(req);
    if (h.value < 0.001) S.holdings.splice(w.i, 1);
    recordHist();
    S.wdraft = null;
    notify('Withdrawal Request Update', `We received your request to withdraw ${bd(amt)}. Expected credit by ${fd(addD(S.today, NOTICE + 3))}.`);
    go('wstatus', { id: req.id }, true);
  }
  function finishWithdrawal(id) {
    const w = S.wds.find(x => x.id === id);
    if (w.status === 'Completed') return;
    w.status = 'Completed'; w.tx.status = 'Completed';
    if (w.perf > 0) addTx('Performance Fee', w.pool, -w.perf);
    S.balance += w.net;
    notify('Withdrawal Request Update', `${bd(w.net)} has been credited to your Current Account.`);
    render();
  }

  const A = {
    go: a => go(a),
    home: () => home(),
    toast: a => toast(a),
    pool: a => go('pool', { k: a }),
    holding: a => go('holding', { i: +a }),
    startInvest: a => startInvest(a),
    mode: a => { keepAmt(); S.draft.mode = a; render(); },
    dset: a => { keepAmt(); const [k, v] = a.split('|'); S.draft[k] = k === 'auto' ? !S.draft.auto : +v; render(); },
    toReview: () => {
      const v = +document.getElementById('zAmt').value, min = POOLS[S.draft.pool].min;
      const err = !v || v <= 0 ? 'Enter an amount.' : v < min ? `The minimum is BHD ${min}.` : '';
      if (err) { document.getElementById('zAmtErr').innerHTML = `<div class="zerr">${err}</div>`; document.getElementById('zAmtBox').classList.add('err'); return; }
      S.draft.amount = v; S.draft.terms = false; S.draft.riskAck = false; go('review');
    },
    confirm: () => invest(),
    backToInvest: () => { S.stack.pop(); render(true); },
    sim: () => simulate(),
    contribFor: (a, el) => { S.cedit = null; go('contrib', { i: +a }, el.dataset.r === '1'); },
    withdrawFor: (a, el) => { S.wdraft = null; go('withdraw', { i: +a }, el.dataset.r === '1'); },
    cset: a => { const [k, v] = a.split('|'); S.cedit[k] = +v; render(); },
    cSave: a => {
      const h = S.holdings[+a], was = h.monthly && h.monthly.status !== 'Cancelled';
      h.monthly = { ...(h.monthly || { auto: true }), amount: S.cedit.amount, day: S.cedit.day, status: 'Active' };
      notify('Important Account Updates', `Your monthly contribution to ${POOLS[h.pool].name} is now ${bd(h.monthly.amount)} on the ${ord(h.monthly.day)} of each month.`);
      toast(was ? 'Monthly contribution updated' : 'Monthly contribution set up'); render();
    },
    cStatus: a => { const [i, s] = a.split('|'); S.holdings[+i].monthly.status = s; S.cancelAsk = false; toast({ Active: 'Contributions resumed', Paused: 'Contributions paused', Cancelled: 'Recurring contributions cancelled' }[s]); render(); },
    cAsk: a => { S.cancelAsk = a === '1'; render(); },
    wMax: a => { S.wdraft.amount = S.holdings[+a].value.toFixed(3); render(); },
    wReview: a => {
      const h = S.holdings[+a], v = +document.getElementById('zWAmt').value;
      const err = !v || v <= 0 ? 'Enter an amount.' : v > h.value + 1e-9 ? `You can withdraw up to ${bd(h.value)}.` : '';
      if (err) { document.getElementById('zWErr').innerHTML = `<div class="zerr">${err}</div>`; document.getElementById('zWBox').classList.add('err'); return; }
      S.wdraft.amount = v; go('wreview');
    },
    wSubmit: () => submitWithdrawal(),
    wstatus: a => go('wstatus', { id: +a }),
    wFinish: a => finishWithdrawal(+a),
    txf: a => { S.txFilter = a; render(); },
    ans: a => { const [k, v] = a.split('|'); S.riskAns[k] = +v; render(); },
    riskDone: () => { const vs = Object.values(S.riskAns), avg = vs.reduce((x, y) => x + y, 0) / vs.length; S.risk = { pool: avg < 1.75 ? 'stable' : avg < 2.5 ? 'balanced' : 'growth' }; render(true); },
    riskRedo: () => { S.riskAns = {}; S.risk = null; render(true); },
    calcPool: a => { S.calc.pool = a; render(); },
    set: a => { S.settings[a] = !S.settings[a]; render(); },
  };

  /* ---------------- events ---------------- */
  const zb = document.getElementById('zBody');
  zb.addEventListener('click', e => {
    const t = e.target.closest('[data-z]');
    if (!t || t.disabled) return;
    e.preventDefault();
    if (A[t.dataset.z]) A[t.dataset.z](t.dataset.a, t);
  });
  zb.addEventListener('change', e => {
    const k = e.target.dataset.zc;
    if (k) { S.draft[k] = e.target.checked; render(); }
    const r = e.target.dataset.zr;
    if (r) { S.calc[r] = +e.target.value; render(); }
  });
  zb.addEventListener('input', e => {
    if (e.target.id === 'zAmt') { document.getElementById('zAmtErr').innerHTML = ''; document.getElementById('zAmtBox').classList.remove('err'); }
    if (e.target.id === 'zWAmt') { S.wdraft.amount = e.target.value; document.getElementById('zWErr').innerHTML = ''; document.getElementById('zWBox').classList.remove('err'); }
    const r = e.target.dataset.zr;
    if (r === 'monthly') document.getElementById('zcM').textContent = `BHD ${e.target.value}`;
    if (r === 'years') document.getElementById('zcY').textContent = `${e.target.value} year${+e.target.value > 1 ? 's' : ''}`;
  });
  document.getElementById('zBell').addEventListener('click', () => { S.notifs.forEach(n => { n.read = true; }); if (cur().s !== 'notifs') go('notifs'); else render(); });

  return { open, back, go, home, balance: () => S.balance };
})();

document.getElementById('zBack').addEventListener('click', () => Z.back());
document.querySelector('.nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  if (b.dataset.nav === 'home') Z.home(); else Z.go(b.dataset.nav);
});
Z.open();
</script>

</body>
</html>
